<!doctype html><html><head><meta charset="utf-8"><style>
/* HYPE or FACT? minimal template (Tunde-style layout, uk_speaks.ai yellow/black, Inter only) */
@font-face{font-family:IN;src:url(../../templates/fonts/inter-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:IN;src:url(../../templates/fonts/inter-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:ML;src:url(../../templates/fonts/noto-sans-malayalam-malayalam-800-normal.woff2);font-weight:800}
:root{--y:#FFD84D;--ink:#0d0d0d}
html,body{margin:0;background:transparent}
#st{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:IN,ML;-webkit-font-smoothing:antialiased}
.a{position:absolute}.hide{display:none!important}
/* intro: label above the subject card + frame + credit */
#hk{left:50%;top:230px;transform:translateX(-50%);text-align:center;white-space:nowrap}
#hk span{display:inline-block;background:var(--ink);color:var(--y);font:800 66px/1.12 IN;letter-spacing:-.02em;padding:24px 34px 30px;border-radius:26px;box-shadow:0 18px 44px rgba(0,0,0,.35)}
#hfr{left:20px;top:504px;width:560px;height:996px;border:6px solid var(--y);border-radius:36px}
#cred{left:26px;top:1520px;white-space:nowrap;font:700 28px/1 IN;color:#fff;background:var(--ink);padding:10px 16px;border-radius:12px}
/* title pop */
#ti{left:50%;top:230px;transform:translateX(-50%);text-align:center}
#ti span{display:inline-block;font:800 124px/1.02 IN;white-space:nowrap;letter-spacing:-.04em;background:var(--ink);color:var(--y);padding:26px 40px 34px;border-radius:30px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
/* checkbox row */
#row{left:50%;top:380px;transform:translateX(-50%);display:flex;align-items:center;gap:28px;background:rgba(13,13,13,.9);padding:18px 34px;border-radius:28px;white-space:nowrap}
.cb{display:flex;align-items:center;gap:20px;font:800 78px/1 IN;color:#fff}
.bx{width:76px;height:76px;border-radius:14px;border:6px solid #fff;box-sizing:border-box;position:relative}
.bx b{position:absolute;inset:-6px;background:var(--y);border-radius:10px;color:var(--ink);font:800 68px/88px IN;text-align:center}
#or{font:800 52px/1 IN;color:var(--y)}
#cfact.off{opacity:.4;text-decoration:line-through;text-decoration-thickness:5px}
/* screen card */
#card{left:24px;top:1170px;width:1032px;height:580px;border-radius:30px;background:var(--y);padding:12px;box-sizing:border-box;box-shadow:0 20px 50px rgba(0,0,0,.35)}
#win{position:relative;width:1008px;height:556px;border-radius:20px;overflow:hidden;background:#fff}
#win img{position:absolute;left:0;top:0;width:1008px;transform-origin:0 0}
.hl{position:absolute;background:rgba(255,216,77,.6);mix-blend-mode:multiply;border-radius:6px;transform-origin:left center}
/* moving subtitles: one box per chunk, words rise in */
#cap{left:0;width:1080px;text-align:center}
#box{display:inline-block;font:800 60px/1.35 IN,ML;padding:14px 30px 20px;border-radius:20px;max-width:940px}
#box.pl{background:var(--ink);color:#FFF06A}#box.ky{background:var(--y);color:var(--ink)}
#box i{font-style:normal;display:inline-block;margin:0 .14em}
/* answer + cta */
#ans{left:50%;top:1300px;transform:translateX(-50%);text-align:center}
#ans span{display:inline-block;white-space:nowrap;font:800 64px/1 IN;background:var(--y);color:var(--ink);padding:20px 34px 24px;border-radius:22px}
#cta{left:50%;top:1300px;transform:translateX(-50%)}
#cta span{display:inline-block;font:800 60px/1 IN;background:var(--y);color:var(--ink);padding:22px 34px 26px;border-radius:22px;white-space:nowrap}
</style></head><body><div id="st">
<div class="a" id="hfr"></div><div class="a" id="cred">Credits: @hadibuilds.ai</div>
<div class="a" id="hk"><span>Can Claude really delete<br>your digital footprint?<br>I tested this viral video.</span></div>
<div class="a" id="card"><div id="win"><img id="img"><div id="hls"></div></div></div>
<div class="a" id="row"><div class="cb" id="chype"><div class="bx" id="bh"><b>✓</b></div>HYPE</div><span id="or">OR</span><div class="cb" id="cfact"><div class="bx"></div>FACT</div></div>
<div class="a" id="ans"><span>For India: HYPE</span></div>
<div class="a" id="cta"><span>Comment DELETE for the guide</span></div>
<div class="a" id="cap"><span id="box"></span></div>
</div><script>
const TL=__TL__, ST=__ST__;
const $=id=>document.getElementById(id), cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-cl(x),3), eb=x=>{x=cl(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const IMG={guide:'guide',r1:'r1',f1:'f1',f1b:'f1',f2:'f2',india:'india',india2:'india'};
const show=(id,on)=>$(id).classList.toggle('hide',!on); let last='';
const seg=s=>TL.segs.find(x=>x.scene===s), ANS=seg('answer').t0+1.0;
window.frame=t=>{
  const g=TL.segs.find(x=>t>=x.t0&&t<x.t1)||TL.segs[TL.segs.length-1], lt=t-g.t0, sc=g.scene;
  // intro
  const intro=sc==='hook'; show('hk',intro);
  if(intro){const h=eb((lt-0.35)/0.4);$('hk').style.opacity=cl((lt-0.35)/0.12)*cl((g.t1-t)/0.2);$('hk').style.transform=`translateX(-50%) translateY(${(1-h)*-40}px) scale(${0.88+0.12*h})`}
  const [K0,K1]=TL.hk, vi=intro&&lt>=K0&&lt<K1; show('hfr',vi); show('cred',vi);
  if(vi){const k=eb((lt-K0)/0.3),o=cl((K1-lt)/0.2);$('hfr').style.opacity=cl((lt-K0)/0.12)*o;$('cred').style.opacity=cl((lt-K0)/0.12)*o;$('hfr').style.transform=`scale(${0.85+0.15*k})`}
  // checkbox row from the first test step to the end
  const main=!intro; show('row',main);
  if(main){const t0=seg('guide').t0;const k=eb((t-t0)/0.35);$('row').style.transform=`translateX(-50%) translateY(${(1-k)*30}px)`;$('row').style.opacity=cl((t-t0)/0.2)}
  const v=t-ANS; $('bh').querySelector('b').style.transform=`scale(${v>=0?eb(v/0.35):0})`; $('cfact').classList.toggle('off',v>=0.2);
  $('chype').style.transform=`scale(${v>=0?1+0.15*Math.sin(Math.PI*cl(v/0.45)):1})`;
  // screen card
  const key=IMG[sc]; show('card',!!key);
  if(key){const m=ST[key]; if(last!==key){$('img').src='stills/'+key+'.png';last=key}
    const s=1008/m.w, ih=m.h*s, wh=Math.min(556,ih), pan=Math.max(0,ih-556), dur=g.t1-g.t0; $('win').style.height=wh+'px'; $('card').style.height=(wh+24)+'px';
    const first=TL.segs.find(x=>IMG[x.scene]===key); const tt=t-first.t0, D=TL.segs.filter(x=>IMG[x.scene]===key).reduce((a,x)=>a+x.t1-x.t0,0);
    const py=pan*cl((tt-0.8)/Math.max(1,D-1.6)); $('img').style.transform=`translateY(${-py}px)`;
    const k=eo(lt/0.35); const fresh=g===first; $('card').style.transform=fresh?`translateY(${(1-k)*80}px)`:'none'; $('card').style.opacity=fresh?cl(lt/0.2):1;
    $('hls').innerHTML=g.hl.map(([ht,idx])=>{const r=m.hl[idx];if(!r)return'';const p=eo((t-ht)/0.5);if(p<=0)return'';
      return `<div class="hl" style="left:${r[0]*s}px;top:${r[1]*s-py}px;width:${(r[2]-r[0])*s}px;height:${(r[3]-r[1])*s}px;transform:scaleX(${p})"></div>`}).join('');}
  // subtitles
  const c=g.caps.find(x=>t>=x[0]&&t<x[1]);
  if(!c){$('cap').style.display='none'}else{
    $('cap').style.display='block'; $('cap').style.top=(intro?1380:560)+'px';
    const w=c[2].split(' '), d=c[1]-c[0], per=Math.min(0.32,(d*0.65)/w.length), q=t-c[0];
    $('box').className=c[3]?'ky':'pl'; const bk=eo(q/0.25); $('box').style.transform=`translateY(${(1-bk)*24}px)`; $('box').style.opacity=cl(q/0.15);
    $('box').innerHTML=w.filter((x,i)=>q-i*per>0).map((x,i)=>{const p=eo((q-i*per)/0.28);return `<i style="opacity:${p};transform:translateY(${(1-p)*26}px)">${x}</i>`}).join('')}
  // answer + cta
  show('ans',sc==='answer'&&v>=0.3); if(sc==='answer'){const k=eb((v-0.3)/0.35);$('ans').style.transform=`translateX(-50%) scale(${0.7+0.3*k})`}
  show('cta',sc==='cta'); if(sc==='cta'){const k=eb((lt-0.3)/0.35);$('cta').style.transform=`translateX(-50%) scale(${0.7+0.3*k})`;$('cta').style.opacity=cl((lt-0.3)/0.15)}
};
</script></body></html>
