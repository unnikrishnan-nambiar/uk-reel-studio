<!doctype html><html><head><meta charset="utf-8"><style>
/* 5 AI words: TRADE-style big 3D yellow/black words + quiz questions + Malayalam subtitles */
@font-face{font-family:IN;src:url(../../templates/fonts/inter-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:IN;src:url(../../templates/fonts/inter-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:ML;src:url(../../templates/fonts/noto-sans-malayalam-malayalam-800-normal.woff2);font-weight:800}
:root{--y:#FFD84D;--ink:#0d0d0d}
html,body{margin:0;background:transparent}
#st{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:IN,ML;-webkit-font-smoothing:antialiased}
.a{position:absolute}.hide{display:none!important}
.word{position:absolute;left:0;right:0;text-align:center;white-space:nowrap;font-weight:800;text-transform:uppercase;letter-spacing:-.035em;line-height:.92}
.word span{display:inline-block;-webkit-background-clip:text;background-clip:text;color:transparent}
#qn{left:50%;top:228px;transform:translateX(-50%);font:800 34px/1 IN;letter-spacing:.14em;background:var(--ink);color:var(--y);padding:12px 22px;border-radius:14px;white-space:nowrap}
#fx{left:0;top:470px;width:1080px}
.card{margin:0 50px;background:#fff;border-radius:30px;overflow:hidden;box-shadow:0 0 0 6px #0d0d0d,0 26px 60px rgba(0,0,0,.45)}
.ct{background:#0d0d0d;color:#FFD84D;font:800 30px/1 IN;letter-spacing:.06em;padding:18px 26px}
.cb{position:relative}
.pill{display:inline-block;font:800 50px/1 IN;padding:18px 28px;border-radius:20px;margin:0 10px;background:#fff;color:var(--ink);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.pill.y{background:var(--y)}.pill.k{background:var(--ink);color:var(--y)}
.ord{display:inline-block;font:800 44px/1.1 IN,ML;padding:18px 26px;border-radius:20px;margin:0 8px;box-shadow:0 12px 30px rgba(0,0,0,.35);position:relative}
.ord.bad{background:#fff;color:#6b6b6b}.ord.good{background:var(--y);color:var(--ink)}
.ord .m{position:absolute;right:-16px;top:-18px;width:52px;height:52px;border-radius:50%;font:800 34px/52px IN;text-align:center;color:#fff}
/* subtitles */
#cap{left:0;width:1080px;top:1430px;text-align:center}
#box{display:inline-block;font:800 58px/1.35 IN,ML;padding:14px 30px 20px;border-radius:20px;max-width:960px}
#box.pl{background:var(--ink);color:#FFF06A}#box.ky{background:var(--y);color:var(--ink)}
#box i{font-style:normal;display:inline-block;margin:0 .14em}
</style></head><body><div id="st">
<div class="word" id="w" style="top:300px"></div>
<div class="a" id="qn"></div>
<div class="a" id="fx"></div>
<div class="a" id="cap"><span id="box"></span></div>
</div><script>
const TL=__TL__;
const $=id=>document.getElementById(id), cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-cl(x),3), back=x=>{x=cl(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}, p=(t,a,d)=>cl((t-a)/d);
// source time -> body time
const B=s=>{for(const g of TL.segs){const a=g.a,b=g.b;if(s>=a&&s<=b)return g.t0+(s-a)}let best=0;for(const g of TL.segs)if(s>g.b)best=g.t1;return best};
function style(el,size){el.style.fontSize=size+'px';const o=Math.max(3,Math.round(size*.022));
  el.style.filter=`drop-shadow(${o}px 0 0 #0d0d0d) drop-shadow(-${o}px 0 0 #0d0d0d) drop-shadow(0 ${o}px 0 #0d0d0d) drop-shadow(0 -${o}px 0 #0d0d0d) drop-shadow(0 5px 0 #0d0d0d) drop-shadow(0 10px 0 #0d0d0d) drop-shadow(0 16px 24px rgba(0,0,0,.55))`;
  [...el.children].forEach(sp=>{sp.style.backgroundImage='linear-gradient(#FFD84D,#FFD84D)'})}
function setWord(el,txt,maxSize,maxW){if(el.dataset.k===txt)return;el.dataset.k=txt;
  if(txt.includes('|')){el.innerHTML=txt.split('').map(ch=>ch==='|'?'<br>':`<span>${ch===' '?'&nbsp;':ch}</span>`).join('');style(el,150);[...el.children].forEach(sp=>{if(sp.tagName==='BR')sp.style.backgroundImage=''});return}
  el.innerHTML=txt.split('').map(ch=>`<span>${ch===' '?'&nbsp;':ch}</span>`).join('');style(el,maxSize);
  const W=[...el.children].reduce((s,x)=>s+x.getBoundingClientRect().width,0);if(W>maxW)style(el,maxSize*maxW/W)}
function animWord(el,t,a,b){const n=el.children.length;const ord=[...Array(n).keys()].sort((x,y)=>((x*7+3)%n)-((y*7+3)%n));
  [...el.children].forEach((sp,i)=>{const k=p(t,a+ord.indexOf(i)*.035,.22);sp.style.opacity=eo(k);sp.style.transform=`translateY(${(1-eo(k))*-40}px) scale(${1.5-.5*back(k)})`});
  el.style.opacity=cl((b-t)/.1)}
// cues in SOURCE time: [start, end, big word, question label, scene]. A scene replaces the big word with a big card.
const CUES=[
 [0.5,1.7,'60 SECONDS','',''],
 [1.7,3.8,'5 AI WORDS','',''],
 [3.8,6.7,'ARTIFICIAL|INTELLIGENCE','1 OF 5',''],
 [6.7,12.8,'','1 OF 5','brain'],
 [13.0,16.2,'CHATGPT + CLAUDE','2 OF 5',''],
 [16.2,20.3,'','2 OF 5','apps'],
 [20.5,23.0,'MODELS','3 OF 5',''],
 [23.0,30.3,'','3 OF 5','models'],
 [30.4,33.5,'= QUALITY','3 OF 5',''],
 [33.6,36.7,'TOKENS','4 OF 5',''],
 [36.7,42.4,'','4 OF 5','tokens'],
 [42.4,45.8,'','4 OF 5','mal'],
 [45.8,48.6,'PROMPT','5 OF 5',''],
 [48.6,57.0,'','5 OF 5','order'],
 [57.0,59.25,'CLEAR = BETTER','5 OF 5',''],
 [59.25,62.9,'YOUR SCORE?','','score'],
 [62.9,65.4,'COMMENT IT','','score'],
].map(c=>({a:B(c[0]),b:B(c[1]),w:c[2],q:c[3],fx:c[4],sa:c[0]}));
const S2B=s=>B(s);
const card=(title,body)=>`<div class="card"><div class="ct">${title}</div><div class="cb">${body}</div></div>`;
const pop=(lt,at)=>back((lt-at)/.35), op=(lt,at)=>eo((lt-at)/.2);
window.frame=t=>{
  const c=CUES.find(x=>t>=x.a&&t<x.b);
  const big=c&&c.w&&!(c.fx&&c.fx!=='score');
  if(big){$('w').style.display='block';setWord($('w'),c.w,180,920);animWord($('w'),t,c.a,c.b)}else $('w').style.display='none';
  if(c&&c.q){$('qn').classList.remove('hide');$('qn').textContent=c.q;const first=CUES.find(x=>x.q===c.q);const k=back(p(t,first.a,.3));$('qn').style.transform=`translateX(-50%) scale(${.7+.3*k})`}else $('qn').classList.add('hide');
  const fx=c?c.fx:''; const lt=c?t-c.a:0; let h='';
  const enter=`transform:translateY(${(1-eo(lt/.35))*60}px) scale(${.92+.08*eo(lt/.35)});opacity:${cl(lt/.2)*cl(((c?c.b:0)-t)/.15)}`;
  if(fx==='brain'){ // books fly into the AI brain, then it answers
    const books=['#FFD84D','#ffffff','#FFD84D','#ffffff','#FFD84D'].map((col,i)=>{const k=eo((lt-i*.18)/.6);const x0=40+i*30,y0=60+(i%2)*90,x=x0+(330-x0)*k,y=y0+(150-y0)*k;
      return `<div style="position:absolute;left:${x}px;top:${y}px;width:70px;height:92px;border-radius:8px;background:${col};border:5px solid #0d0d0d;opacity:${1-k*.9};transform:rotate(${(1-k)*(-12+i*6)}deg)"></div>`}).join('');
    const r=1+.06*Math.sin(lt*6);
    const msg='Hi! How can I help?'.slice(0,Math.max(0,Math.floor((lt-1.6)*14)));
    h=card('A BRAIN THAT LEARNED BY READING',`<div style="position:relative;height:300px">${books}
      <div style="position:absolute;left:330px;top:80px;width:180px;height:180px;border-radius:50%;background:#0d0d0d;color:#FFD84D;font:800 76px/180px IN;text-align:center;transform:scale(${r})">AI</div>
      <div style="position:absolute;left:560px;top:110px;width:340px;padding:22px 26px;border-radius:26px 26px 26px 6px;background:#FFD84D;font:800 40px/1.15 IN;opacity:${op(lt,1.5)}">${msg}<span style="opacity:${Math.floor(lt*3)%2}">|</span></div></div>`)}
  if(fx==='apps'){ // three shops
    const shops=[['ChatGPT','OpenAI'],['Claude','Anthropic'],['Gemini','Google']].map(([n,co],i)=>{const k=pop(lt,.2+i*.6);
      return `<div style="width:270px;transform:translateY(${(1-k)*120}px) scale(${.6+.4*k});opacity:${op(lt,.2+i*.6)}">
        <div style="height:46px;border-radius:14px 14px 0 0;background:repeating-linear-gradient(90deg,#FFD84D 0 34px,#0d0d0d 34px 68px)"></div>
        <div style="background:#fff;border:6px solid #0d0d0d;border-top:none;border-radius:0 0 18px 18px;padding:22px 10px;text-align:center"><div style="font:800 46px/1 IN">${n}</div><div style="font:700 26px/1 IN;color:#555;margin-top:12px">by ${co}</div></div></div>`}).join('');
    h=card('CHATGPT, CLAUDE, GEMINI = APPS (THE SHOP)',`<div style="display:flex;justify-content:space-between;padding:26px 30px">${shops}</div>`)}
  if(fx==='models'){ // chefs inside each shop, then quality meter
    const chef=(name,tag,i,hl)=>{const k=pop(lt,.3+i*.9);return `<div style="display:flex;align-items:center;gap:16px;background:${hl?'#FFD84D':'#f3f3f3'};border-radius:18px;padding:14px 18px;transform:scale(${.6+.4*k});opacity:${op(lt,.3+i*.9)}">
      <svg width="58" height="58" viewBox="0 0 24 24"><path d="M6 13a4 4 0 1 1 2-7.5A4 4 0 0 1 16 5.5 4 4 0 1 1 18 13v5H6z" fill="#fff" stroke="#0d0d0d" stroke-width="1.6"/><rect x="6" y="18" width="12" height="3" fill="#0d0d0d"/></svg>
      <div><div style="font:800 40px/1 IN">${name}</div><div style="font:700 24px/1 IN;color:#444;margin-top:6px">${tag}</div></div></div>`};
    const q=eo((lt-4.2)/1.4);
    h=card('MODEL = THE CHEF INSIDE THE APP',`<div style="display:flex;gap:26px;padding:22px 30px 10px">
      <div style="flex:1"><div style="font:800 28px IN;letter-spacing:.1em;margin-bottom:12px">CHATGPT</div>${chef('GPT models','fast or smart',0,0)}</div>
      <div style="flex:1;display:flex;flex-direction:column;gap:12px"><div style="font:800 28px IN;letter-spacing:.1em">CLAUDE</div>${chef('Opus','smartest',1,1)}${chef('Sonnet','fast + smart',2,0)}</div></div>
      <div style="padding:6px 30px 24px;opacity:${op(lt,4)}"><div style="font:800 28px IN;letter-spacing:.1em">ANSWER QUALITY</div><div style="height:30px;border-radius:12px;background:#eee;margin-top:10px;overflow:hidden"><div style="height:100%;width:${q*92}%;background:#FFD84D;border-right:6px solid #0d0d0d"></div></div></div>`)}
  if(fx==='tokens'){ // a sentence splits into token chips, then "limit + cost"
    const parts=['I',' love',' using',' AI',' tools'],sp=eo((lt-.6)/.6)*18;
    const chips=parts.map((x,i)=>`<span style="display:inline-block;font:800 54px/1 IN;padding:16px ${10+sp}px;margin:0 ${sp/2}px;border-radius:${sp>3?16:0}px;background:${i%2?'#FFD84D':'#fff'};border:${sp>3?'5px solid #0d0d0d':'0'}">${x.trim()}</span>`).join('');
    const meter=eo((lt-2.5)/2);
    h=card('TOKENS = SMALL WORD PIECES',`<div style="text-align:center;padding:40px 20px 16px">${chips}</div>
      <div style="display:flex;gap:20px;padding:6px 30px 26px;opacity:${op(lt,2.4)}">
      <div style="flex:1;background:#0d0d0d;color:#FFD84D;border-radius:18px;padding:18px 22px;font:800 38px IN">Your limit</div>
      <div style="flex:1;background:#0d0d0d;color:#FFD84D;border-radius:18px;padding:18px 22px;font:800 38px IN">API cost</div></div>
      <div style="padding:0 30px 26px;opacity:${op(lt,2.4)}"><div style="height:22px;border-radius:10px;background:#eee;overflow:hidden"><div style="height:100%;width:${meter*70}%;background:#FFD84D"></div></div><div style="font:700 24px IN;color:#444;margin-top:8px">counted in tokens</div></div>`)}
  if(fx==='mal'){ // English vs Malayalam chips (illustration)
    const row=(lab,n,at,col)=>`<div style="display:flex;align-items:center;gap:16px;margin:16px 0;opacity:${op(lt,at)}"><div style="width:220px;font:800 40px IN">${lab}</div><div>${[...Array(n)].map((_,i)=>`<span style="display:inline-block;width:46px;height:46px;margin:0 4px;border-radius:10px;background:${col};border:5px solid #0d0d0d;transform:scale(${pop(lt,at+i*.08)})"></span>`).join('')}</div></div>`;
    h=card('MALAYALAM USES MORE TOKENS',`<div style="padding:24px 34px 10px">${row('English',3,.2,'#fff')}${row('Malayalam',9,.8,'#FFD84D')}</div><div style="padding:0 34px 24px;font:700 24px IN;color:#555">Illustration: the same sentence</div>`)}
  if(fx==='order'){ // hotel order: vague vs clear
    const vague=op(lt,0),x1=lt>1.6,clear=op(lt,2.6),ok=lt>3.4;
    h=card('PROMPT = YOUR ORDER',`<div style="display:flex;gap:24px;padding:26px 30px">
      <div style="flex:1;background:#f3f3f3;border-radius:22px;padding:22px;opacity:${vague};position:relative">
        <div style="font:800 40px/1.2 IN,ML">"എന്തെങ്കിലും താ"</div>
        <div style="margin-top:22px;height:110px;border-radius:50%;background:#ddd;display:flex;align-items:center;justify-content:center;font:800 70px IN;color:#888">?</div>
        ${x1?`<div style="position:absolute;right:-14px;top:-14px;width:64px;height:64px;border-radius:50%;background:#E5484D;color:#fff;font:800 42px/64px IN;text-align:center;transform:scale(${pop(lt,1.6)})">✕</div>`:''}</div>
      <div style="flex:1;background:#FFD84D;border-radius:22px;padding:22px;opacity:${clear};position:relative;transform:scale(${.85+.15*eo((lt-2.6)/.3)})">
        <div style="font:800 40px/1.2 IN">"Chicken biryani, half plate"</div>
        <div style="margin-top:22px;height:110px;border-radius:50%;background:#fff;border:6px solid #0d0d0d;display:flex;align-items:center;justify-content:center;font:800 34px IN">BIRYANI</div>
        ${ok?`<div style="position:absolute;right:-14px;top:-14px;width:64px;height:64px;border-radius:50%;background:#1fbf5f;color:#fff;font:800 42px/64px IN;text-align:center;transform:scale(${pop(lt,3.4)})">✓</div>`:''}</div></div>`)}
  if(fx==='score'){ // 5 boxes tick one by one, then ? / 5
    const s0=CUES[CUES.length-2].a, u=t-s0;
    h=`<div style="text-align:center;margin-top:20px">${[...Array(5)].map((_,i)=>`<span style="display:inline-block;width:110px;height:110px;margin:0 9px;border-radius:22px;background:${u>.4+i*.35?'#FFD84D':'#fff'};border:7px solid #0d0d0d;font:800 70px/96px IN;text-align:center;transform:scale(${.6+.4*back((u-.4-i*.35)/.3)})">${u>.4+i*.35?'✓':''}</span>`).join('')}</div>`}
  $('fx').innerHTML=fx&&fx!=='score'?`<div style="${enter}">${h}</div>`:h;
  $('fx').style.top=(fx&&fx!=='score')?'236px':'480px';
  // Malayalam subtitles: one box per chunk, words rise in
  const g=TL.segs.find(x=>t>=x.t0&&t<x.t1)||TL.segs[TL.segs.length-1];
  const s=g.caps.find(x=>t>=x[0]&&t<x[1]);
  if(!s){$('cap').style.display='none'}else{$('cap').style.display='block';
    const w=s[2].split(' '),d=s[1]-s[0],per=Math.min(0.3,(d*0.6)/w.length),q=t-s[0];
    $('box').className=s[3]?'ky':'pl';const bk=eo(q/0.25);$('box').style.transform=`translateY(${(1-bk)*24}px)`;$('box').style.opacity=cl(q/0.15);
    $('box').innerHTML=w.filter((x,i)=>q-i*per>0).map((x,i)=>{const k=eo((q-i*per)/0.28);return `<i style="opacity:${k};transform:translateY(${(1-k)*26}px)">${x}</i>`}).join('')}
};
</script></body></html>
