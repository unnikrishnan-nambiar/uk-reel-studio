<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:IN;src:url(../../templates/fonts/inter-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:IN;src:url(../../templates/fonts/inter-latin-800-normal.woff2);font-weight:800}
html,body{margin:0;background:transparent}
#st{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:IN;-webkit-font-smoothing:antialiased;color:#F4F1EA}
.a{position:absolute}
/* one strip under the hook box, over the hair only, inside the IG safe zone */
#strip{left:70px;top:455px;width:870px;height:228px;border-radius:30px;background:rgba(13,13,13,.9);box-shadow:0 18px 40px rgba(0,0,0,.35)}
#hd{left:100px;top:478px;display:flex;align-items:center;gap:12px;font:800 30px IN}
#q{left:100px;top:540px;width:380px;background:#2f3542;border-radius:24px;padding:14px 20px;font:700 28px/1.25 IN;min-height:70px;box-sizing:border-box}
.r{left:510px;width:400px;height:42px;border-radius:12px;background:#1f2430;display:flex;align-items:center;gap:12px;padding:0 14px;box-sizing:border-box;font:700 23px IN}
.r i{font-style:normal;width:26px;height:26px;border-radius:50%;background:#FFD84D;color:#0d0d0d;font:800 17px/26px IN;text-align:center;flex:none}
#you{background:#3a2020;color:#ff8a80}
#you i{background:#ff5f57;color:#fff}
#st2{left:772px;top:622px;font:800 18px IN;letter-spacing:.12em;background:#ff5f57;color:#fff;padding:5px 10px;border-radius:8px}
</style></head><body><div id="st">
<div class="a" id="strip"></div>
<div class="a" id="hd"><img src="logo/openai.svg" style="width:40px;filter:invert(1)">ChatGPT</div>
<div class="a" id="q"></div>
<div id="rows"></div>
<div class="a" id="st2">NOT LISTED</div>
</div>
<script>
const $=id=>document.getElementById(id);const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));const eo=x=>1-Math.pow(1-cl(x),3);
const R=['Shop A','Shop B','Shop C'];
$('rows').innerHTML=R.map((r,i)=>`<div class="a r" id="r${i}" style="top:${472+i*50}px"><i>${i+1}</i>${r}</div>`).join('')+`<div class="a r" id="you" style="top:622px"><i>✕</i>Your shop</div>`;
const Q='best interior designer near me?';
window.frame=t=>{
  const s=eo((t-.02)/.25);['strip','hd','q'].forEach(id=>$(id).style.opacity=s);
  $('q').textContent=Q.slice(0,Math.floor(cl((t-.25)/.8)*Q.length));
  R.forEach((r,i)=>{const k=eo((t-1.15-i*.12)/.3);const e=$('r'+i);e.style.opacity=k;e.style.transform=`translateX(${(1-k)*60}px)`});
  const k=eo((t-1.6)/.3);$('you').style.opacity=k;$('you').style.transform=`translateX(${(1-k)*60}px)`;
  const st=cl((t-1.95)/.2);$('st2').style.opacity=st;$('st2').style.transform=`rotate(-6deg) scale(${1.6-.6*st})`;
};
</script></body></html>
