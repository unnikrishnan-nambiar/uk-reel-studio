<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:IN;src:url(../../templates/fonts/inter-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:IN;src:url(../../templates/fonts/inter-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:IN;src:url(../../templates/fonts/inter-latin-800-normal.woff2);font-weight:800}
html,body{margin:0;background:transparent}
#st{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:IN;color:#111;-webkit-font-smoothing:antialiased}
.a{position:absolute}
.paper{position:absolute;left:0;top:0;width:1080px;overflow:hidden;background:radial-gradient(90% 70% at 50% 40%,#fbfbfa 0%,#f1f1ee 70%,#e9e9e5 100%)}
.paper:before{content:'';position:absolute;left:-120px;top:-160px;width:900px;height:620px;opacity:.10;filter:blur(18px);background:
 radial-gradient(ellipse 120px 26px at 30% 30%,#5a6650 60%,transparent 62%),radial-gradient(ellipse 140px 24px at 52% 22%,#5a6650 60%,transparent 62%),radial-gradient(ellipse 110px 22px at 70% 40%,#5a6650 60%,transparent 62%),radial-gradient(ellipse 150px 26px at 40% 52%,#5a6650 60%,transparent 62%);transform:rotate(-18deg)}
.paper:after{content:'';position:absolute;inset:0;opacity:.07;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.pillk{display:inline-block;background:#111;color:#fff;font:800 26px IN;letter-spacing:.14em;padding:12px 26px;border-radius:999px;box-shadow:0 10px 24px rgba(0,0,0,.2)}
.ttl{font:800 64px/1.03 IN;letter-spacing:-.035em;color:#111}
.sl{display:block;border-radius:14px;box-shadow:0 20px 40px rgba(0,0,0,.16),0 3px 8px rgba(0,0,0,.06)}
.win{border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 34px 70px rgba(0,0,0,.2),0 6px 16px rgba(0,0,0,.08)}
.tb{height:70px;display:flex;align-items:center;gap:12px;padding:0 24px;background:#f4f4f2;border-bottom:1.5px solid #e5e5e2;font:700 28px IN}
.dot{width:16px;height:16px;border-radius:50%}
.row{display:flex;align-items:center;gap:26px;background:#fff;border-radius:28px;padding:18px 26px;box-shadow:0 20px 40px rgba(0,0,0,.12),0 3px 8px rgba(0,0,0,.05)}
.num{flex:none;width:64px;height:64px;border-radius:50%;background:#111;color:#fff;font:800 32px/64px IN;text-align:center}
.free{display:inline-block;background:#FFD43B;font:800 20px IN;letter-spacing:.12em;padding:6px 14px;border-radius:999px;margin-left:12px;vertical-align:middle}
.chipy{display:inline-block;background:#FFD43B;color:#111;font:800 34px IN;padding:18px 30px;border-radius:999px;box-shadow:0 14px 30px rgba(0,0,0,.14)}
/* captions */
#cap{position:absolute;left:0;right:0;text-align:center}
.cw{font:800 66px/1.05 IN;letter-spacing:-.02em}
.ce{font:800 92px/1 IN;letter-spacing:-.04em;text-transform:uppercase}
.on-l .cw,.on-l .ce,.on-w .cw,.on-w .ce{color:#111}
.on-l .cw,.on-w .cw{font-size:52px}
.on-l .ce,.on-w .ce{font-size:84px}
.on-l .ab,.on-w .ab{font:800 44px IN;color:#333;margin-bottom:-6px}
.on-f .cw{color:#fff;font-size:56px;text-shadow:0 3px 8px rgba(0,0,0,.55),0 0 20px rgba(0,0,0,.35)}
.on-f .ce{font-size:100px;background:linear-gradient(180deg,#fff7c8 0%,#ffe066 45%,#f2b81e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(255,200,60,.55)) drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.on-f .ab{font:800 46px IN;color:rgba(255,255,255,.9);text-shadow:0 3px 8px rgba(0,0,0,.55);margin-bottom:-12px}
/* ===== DARK (Night Studio) theme: ?theme=dark ===== */
html.dark .paper{background:radial-gradient(90% 70% at 50% 40%,#1b1f29 0%,#12141a 65%,#0b0c10 100%)!important}
html.dark .paper:before{display:none}
html.dark .paper:after{opacity:.05!important;mix-blend-mode:screen!important}
html.dark .pillk{background:#C6FF3D!important;color:#0E0F13!important;box-shadow:0 0 30px rgba(198,255,61,.35)!important}
html.dark .ttl{color:#F4F1EA}
html.dark .row{background:#161A22;color:#F4F1EA;box-shadow:0 0 0 2px #2A2F3A,0 20px 40px rgba(0,0,0,.4)}
html.dark .row div{color:#F4F1EA}
html.dark .win{box-shadow:0 34px 70px rgba(0,0,0,.55)!important}
html.dark .on-l .cw,html.dark .on-l .ab,html.dark .on-w .cw,html.dark .on-w .ab{color:#fff!important}
html.dark .on-l .ce,html.dark .on-w .ce{color:#C6FF3D!important}
html.dark .st div{color:#F4F1EA}
html.dark .ar{color:#C6FF3D!important}
.on-f .cw{color:#111!important;text-shadow:none!important;-webkit-text-stroke:10px #fff;paint-order:stroke fill}
.on-f .ce{background:none!important;-webkit-background-clip:border-box!important;background-clip:border-box!important;color:#111!important;filter:none!important;-webkit-text-stroke:14px #fff;paint-order:stroke fill}
.on-f .ab{color:#111!important;text-shadow:none!important;-webkit-text-stroke:9px #fff;paint-order:stroke fill}
</style></head><body><div id="st">

<!-- ===== PANEL (pass P) ===== -->
<div id="panel" class="paper" style="height:1000px;display:none">
  <!-- P1 before/after -->
  <div id="p1" class="a" style="left:0;top:0;width:1080px;height:1000px">
    <div class="a" id="p1h" style="left:0;right:0;top:200px;text-align:center"><span class="pillk" id="p1pill">NORMAL AI DECK</span><div class="ttl" id="p1t" style="margin-top:18px;font-size:56px">Every slide looks the same</div></div>
    <div id="p1g"></div>
  </div>
  <!-- P2 links -->
  <div id="p2" class="a" style="left:0;top:0;width:1080px;height:1000px">
    <div class="a" id="p2h" style="left:90px;top:190px"><span class="pillk">STEP 2</span><span class="ttl" style="font-size:52px;margin-left:22px;vertical-align:middle">Free template websites</span></div>
    <div id="p2l"></div>
  </div>
  <!-- P3 story -->
  <div id="p3" class="a" style="left:0;top:0;width:1080px;height:1000px">
    <div class="a" id="p3h" style="left:0;right:0;top:190px;text-align:center"><span class="pillk">STORY FLOW</span></div>
    <div id="p3g"></div>
  </div>
</div>

<!-- ===== TOP (pass T) ===== -->
<!-- W1 step 1 card -->
<div id="w1" class="paper" style="height:1920px;display:none">
  <div class="a" id="w1h" style="left:90px;top:250px"><span class="pillk">STEP 1</span><div class="ttl" style="margin-top:26px">Save your content<br>as a .md file</div></div>
  <div class="a win" id="w1w" style="left:90px;top:560px;width:900px;height:640px">
    <div class="tb"><div class="dot" style="background:#ff5f57"></div><div class="dot" style="background:#febc2e"></div><div class="dot" style="background:#28c840"></div><span style="margin-left:18px">content.md</span></div>
    <div id="w1txt" style="padding:34px 40px;font:600 32px/1.5 IN;color:#222;white-space:pre-wrap"></div>
  </div>
  <div class="a" id="w1tip" style="left:0;right:0;top:1270px;text-align:center"><span class="chipy">Plain text = fewer tokens</span></div>
</div>
<!-- D1 result card -->
<div id="d1" style="position:absolute;inset:0;background:#0d0e11;display:none">
  <div class="a" id="d1h" style="left:90px;top:250px;color:#fff"><div style="font:800 28px IN;letter-spacing:.2em;color:#FFD43B">THE RESULT</div><div class="ttl" style="color:#fff;margin-top:20px">One template.<br>A new layout for<br>every point.</div></div>
  <div id="d1g"></div>
  <div class="a" id="d1c" style="left:0;right:0;top:1620px;text-align:center"><span class="chipy">Charts · diagrams · animations</span></div>
</div>
<div id="cap"></div>
</div>
<script>
const Q=new URLSearchParams(location.search),PASS=Q.get('pass')||'T';if(Q.get('theme')==='dark')document.documentElement.classList.add('dark');
const $=id=>document.getElementById(id);const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-cl(x),3);const back=x=>{x=cl(x);const c=1.4;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const p=(t,a,d=.45)=>cl((t-a)/d);
function pop(el,t,a,dy=40,d=.45){const k=p(t,a,d);el.style.opacity=eo(k);el.style.transform=`translateY(${(1-eo(k))*dy}px)`;el.style.filter=k<1?`blur(${(1-eo(k))*8}px)`:'none'}
function sx(el,t,a,dx=300,d=.5){const k=p(t,a,d);el.style.opacity=eo(k);el.style.transform=`translateX(${(1-eo(k))*dx}px)`}
const IMG='../../templates/scenes/img/';
// P1 grid
$('p1g').innerHTML=[1,2,3,4].map(i=>`<img class="a sl pb" src="${IMG}late-payments-before-${i}.png" style="left:${185+(i-1)%2*360}px;top:${330+Math.floor((i-1)/2)*210}px;width:350px">`).join('')+
 [1,2,3,5].map((s,i)=>`<img class="a sl pa" src="${IMG}late-payments-after-${s}.png" style="left:${185+i%2*360}px;top:${330+Math.floor(i/2)*210}px;width:350px">`).join('');
$('p2l').innerHTML=[['Slidesgo','slidesgo.com'],['Figma Community','figma.com/community'],['Microsoft PowerPoint','powerpoint.cloud.microsoft']].map((l,i)=>`<div class="a row lk" style="left:90px;top:${310+i*150}px;width:900px;box-sizing:border-box"><div class="num">${i+1}</div><div><div style="font:800 40px IN;letter-spacing:-.02em">${l[0]}<span class="free">FREE</span></div><div style="font:700 28px IN;color:#555;margin-top:4px">${l[1]}</div></div></div>`).join('');
const ST=[['Hook',1],['Problem',2],['Insight',3],['Solution',4],['Proof',6],['Ask',7]];
$('p3g').innerHTML=ST.map((s,i)=>`<div class="a st" style="left:${70+i%3*320}px;top:${265+Math.floor(i/3)*225}px;width:300px"><img class="sl" src="${IMG}late-payments-after-${s[1]}.png" style="width:300px;border-radius:10px"><div style="font:800 28px IN;margin-top:12px;text-align:center">${i+1}. ${s[0]}</div></div>`).join('')+
 [0,1,2,3,4].filter(i=>i!=2).map(i=>`<div class="a ar" style="left:${70+i%3*320+302}px;top:${265+Math.floor(i/3)*225+60}px;font:800 30px IN;color:#111">→</div>`).join('');
$('d1g').innerHTML=[1,2,3,4,5,7].map((s,i)=>`<img class="a sl dg" src="${IMG}late-payments-after-${s}.png" style="left:${90+i%2*460}px;top:${700+Math.floor(i/2)*290}px;width:440px;box-shadow:0 20px 50px rgba(0,0,0,.5)">`).join('');
const MD=`# Stop late payments\n\nAudience: shop partners\nGoal: approve reminders\n\n## What I want to say\n1. We lose ₹4 lakh a month\n2. 6 in 10 pay after 30 days\n3. Fix: WhatsApp reminders`;
// layout per body time
const LAY=[[0,'f'],[1.0,'l'],[4.42,'w'],[8.37,'l'],[11.14,'w'],[14.51,'f'],[15.6,'w'],[20.36,'d'],[22.33,'l'],[27.47,'f']];
function lay(t){let l='f';for(const [a,x] of LAY)if(t>=a)l=x;return l}
let CAPS=[];
window.setCaps=c=>{CAPS=c};
function caption(t){
  const L=lay(t),c=$('cap');let cur=null;for(const x of CAPS)if(t>=x[0]&&t<x[1])cur=x;
  if(!cur||L==='d'){c.innerHTML='';return}
  const m=cur[2].match(/^(.*?)\{(.+)\}(.*)$/);
  let h;if(m){const pre=(m[1]+' ').trim();h=(pre?`<div class="ab">${pre}</div>`:'')+`<div class="ce">${m[2]}</div>`+(m[3].trim()?`<div class="ab" style="margin-top:6px">${m[3].trim()}</div>`:'')}else h=`<div class="cw">${cur[2]}</div>`;
  c.className='on-'+(L==='w'?'w':L);c.innerHTML=h;
  const k=p(t,cur[0],.22);c.style.opacity=eo(k);c.style.transform=`translateY(${(1-eo(k))*14}px)`;
  const H=c.getBoundingClientRect().height;
  c.style.top=(L==='f'?1300:L==='l'?Math.min(790,870-H):1660)+'px';
}
window.frame=t=>{
  if(PASS==='P'){
    $('w1').style.display=$('d1').style.display='none';$('cap').innerHTML='';
    const on=(t>=0.9&&t<14.6)||(t>=20.9&&t<28.2);$('panel').style.display=on?'block':'none';if(!on)return;
    const s=t<8.37?1:t<20?2:3;['p1','p2','p3'].forEach((id,i)=>$(id).style.display=(i+1===s)?'block':'none');
    if(s===1){const sw=t>=3.05;pop($('p1h'),t,1.15);$('p1pill').textContent=sw?'TEMPLATE + MY PROMPT':'NORMAL AI DECK';$('p1pill').style.background=sw?'#FFD43B':'#111';$('p1pill').style.color=sw?'#111':'#fff';$('p1t').textContent=sw?'Every point gets its own layout':'Every slide looks the same';
      document.querySelectorAll('.pb').forEach((e,i)=>{e.style.display=sw?'none':'block';pop(e,t,1.35+i*.12,30,.4)});
      document.querySelectorAll('.pa').forEach((e,i)=>{e.style.display=sw?'block':'none';if(sw){const k=p(t,3.1+i*.14,.45);e.style.opacity=eo(k);e.style.transform=`scale(${.7+.3*back(k)})`}});}
    if(s===2){pop($('p2h'),t,8.4);document.querySelectorAll('.lk').forEach((e,i)=>sx(e,t,8.75+i*.55,500))}
    if(s===3){pop($('p3h'),t,22.4);document.querySelectorAll('.st').forEach((e,i)=>pop(e,t,22.7+i*.55,30,.4));document.querySelectorAll('.ar').forEach((e,i)=>{e.style.opacity=eo(p(t,23.1+[0,1,3,4][i]*.55,.3))})}
  } else {
    $('panel').style.display='none';
    const w=t>=4.42&&t<8.37;$('w1').style.display=w?'block':'none';
    if(w){pop($('w1h'),t,4.5);pop($('w1w'),t,4.75,50,.5);$('w1txt').textContent=MD.slice(0,Math.floor(cl((t-5.2)/2.2)*MD.length));pop($('w1tip'),t,7.0,30,.4)}
    const d=t>=20.36&&t<22.33;$('d1').style.display=d?'block':'none';
    if(d){pop($('d1h'),t,20.4);document.querySelectorAll('.dg').forEach((e,i)=>{const k=p(t,20.7+i*.16,.45);e.style.opacity=eo(k);e.style.transform=`scale(${.75+.25*back(k)})`});pop($('d1c'),t,21.7,20,.35)}
    caption(t);
  }
};
</script></body></html>
